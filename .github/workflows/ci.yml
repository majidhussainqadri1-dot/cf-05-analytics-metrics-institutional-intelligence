name: CF-05 CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'codex/**'

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Executable quality suite
        run: bash scripts/qa.sh
      - name: Deterministic release build
        run: bash scripts/verify-deterministic-build.sh
      - name: Artifact integrity
        run: |
          set -euo pipefail
          archive="build/dist/CF-05-sabri-analytics-institutional-intelligence-1.0.0-rc.2.zip"
          checksum="${archive}.sha256"
          test -f "$archive"
          test -f "$checksum"
          (cd build/dist && sha256sum -c "$(basename "$checksum")")
          unzip -t "$archive"
          test -f build/dist/CF-05-1.0.0-rc.2-sbom.cdx.json
          test -f build/dist/CF-05-1.0.0-rc.2-package-manifest.json
      - uses: actions/upload-artifact@v4
        if: matrix.php == '8.3'
        with:
          name: cf-05-release-candidate
          path: build/dist/*
