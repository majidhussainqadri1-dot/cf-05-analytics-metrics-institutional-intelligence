name: CF-05 CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'codex/**'

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Executable quality suite
        run: bash scripts/qa.sh
      - name: Deterministic release build
        run: bash scripts/build-release.sh
      - name: Artifact integrity
        run: |
          set -euo pipefail
          sha256sum -c build/CHECKSUMS.sha256
          unzip -t build/CF-05-sabri-analytics-institutional-intelligence-1.0.0-rc.2.zip
      - uses: actions/upload-artifact@v4
        if: matrix.php == '8.3'
        with:
          name: cf-05-release-candidate
          path: |
            build/CF-05-sabri-analytics-institutional-intelligence-1.0.0-rc.2.zip
            build/CHECKSUMS.sha256
            build/cyclonedx-sbom.json
            build/RELEASE-MANIFEST.json
