name: Apply CF-05 Review 7 Retention
on:
  push:
    branches: [codex/cf-05-foundation-0.1.0]
    paths: ['.codex/review7-retention.ready']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Apply review 7 retention fixes
        run: python3 scripts/apply-review7-retention.py
      - name: Remove one-shot files
        run: rm -f .codex/review7-retention.ready scripts/apply-review7-retention.py .github/workflows/apply-review7-retention.yml
      - name: Full governed QA
        run: bash scripts/qa.sh
      - name: Deterministic package verification
        run: bash scripts/verify-deterministic-build.sh
      - name: Commit review 7 fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'review 7: enforce Future retention and research expiry'
          git push origin HEAD:codex/cf-05-foundation-0.1.0
