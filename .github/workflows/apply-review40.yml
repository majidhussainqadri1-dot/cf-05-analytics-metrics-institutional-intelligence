name: Apply CF-05 Forty-Round Payload

on:
  push:
    branches:
      - codex/cf-05-foundation-0.1.0
    paths:
      - .codex/review40.ready

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Recover reviewed source
        run: python3 scripts/apply-review40.py
      - name: PHP syntax preflight
        run: |
          set -euo pipefail
          find . -type f -name '*.php' -print0 | while IFS= read -r -d '' file; do
            php -l "$file" >/dev/null
          done
      - name: Remove one-shot payload
        run: rm -rf .codex
      - name: Full governed QA
        run: bash scripts/qa.sh
      - name: Deterministic package verification
        run: bash scripts/verify-deterministic-build.sh
      - name: Commit reviewed corrections
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "review: apply forty-round CF-05 source corrections"
          git push origin HEAD:${GITHUB_REF_NAME}
