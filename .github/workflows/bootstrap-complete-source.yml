name: CF-05 Complete Source Bootstrap

on:
  push:
    branches:
      - codex/cf-05-foundation-0.1.0

permissions:
  contents: write

jobs:
  expand-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: codex/cf-05-foundation-0.1.0
      - name: Expand reviewed source archive
        shell: bash
        run: |
          set -euo pipefail
          test -d .bootstrap/source || exit 0
          cat .bootstrap/source/chunk-* | base64 --decode > /tmp/cf05-source.tar.gz
          sha256sum -c .bootstrap/source/archive.sha256
          rm -rf assets contracts docs scripts src tests
          rm -f .gitignore CHANGELOG.md CONTRIBUTING.md MANIFEST.json README.md SECURITY.md composer.json readme.txt sabri-analytics-institutional-intelligence.php uninstall.php
          tar -xzf /tmp/cf05-source.tar.gz -C .
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap-complete-source.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "feat: complete CF-05 source candidate 1.0.0-rc.2"
          git push origin HEAD:codex/cf-05-foundation-0.1.0
