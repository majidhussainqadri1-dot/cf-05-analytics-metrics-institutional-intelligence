name: Apply CF-05 Review 15
on:
  push:
    branches: [codex/cf-05-foundation-0.1.0]
    paths: ['.codex/review15.ready']
permissions: {contents: write}
jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: shivammathur/setup-php@v2
        with: {php-version: '8.3', coverage: none}
      - run: python3 scripts/apply-review15.py
      - name: Correct review-15 invariant precision
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/reporting-governance-invariants-check.py')
          s=p.read_text(encoding='utf-8')
          old="""for n in ['AccessProjectService.php','DashboardService.php','ExportService.php','ExportControlService.php']:
              if \"START TRANSACTION\" in files[n] and \"audit->log('analytics_\" in files[n]:
                  e.append(f'{n}: nested/best-effort analytics audit remains in explicit transaction')
          """
          new="""bad_actions={
              'AccessProjectService.php':['analytics_access_requested','analytics_access_granted','analytics_access_revoked','analytics_access_expired'],
              'DashboardService.php':['dashboard_registered','dashboard_activated'],
              'ExportService.php':['analytics_export_requested','analytics_export_ready'],
              'ExportControlService.php':['analytics_export_revoked'],
          }
          for n,actions in bad_actions.items():
              for action in actions:
                  if f\"audit->log('{action}'\" in files[n] or f\"audit->log(\\n            '{action}'\" in files[n]:
                      e.append(f'{n}: mutation audit {action} is not using the caller transaction')
          """
          if old not in s:
              raise SystemExit('review-15 invariant target missing')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
      - run: rm -f .codex/review15.ready scripts/apply-review15.py .github/workflows/apply-review15.yml && rmdir .codex 2>/dev/null || true
      - run: bash scripts/qa.sh
      - run: bash scripts/verify-deterministic-build.sh
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'review 15: close access reporting governance defects'
          git push origin HEAD:codex/cf-05-foundation-0.1.0
