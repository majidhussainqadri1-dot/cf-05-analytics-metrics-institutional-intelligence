name: Apply CF-05 Review 4 Semantics
on:
  push:
    branches: [codex/cf-05-foundation-0.1.0]
    paths: ['.codex/review4-semantics.ready']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Apply review 4 semantic fixes
        run: |
          python3 scripts/apply-review4-semantics.py
          python3 scripts/review4-testfix.py
      - name: Remove one-shot files
        run: rm -f .codex/review4-semantics.ready scripts/apply-review4-semantics.py scripts/review4-testfix.py .github/workflows/apply-review4-semantics.yml
      - name: Full governed QA
        run: bash scripts/qa.sh
      - name: Deterministic package verification
        run: bash scripts/verify-deterministic-build.sh
      - name: Commit review 4 fixes
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "review 4: harden Future-40 semantic correctness"
          git push origin HEAD:codex/cf-05-foundation-0.1.0
