name: Apply CF-05 Sequential Reviews 40-49

on:
  push:
    branches:
      - codex/cf-05-foundation-0.1.0
    paths:
      - .codex/review40-49.ready

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          ini-file: production
      - name: Reconstruct sequential review runner
        run: |
          set -euo pipefail
          cat .codex/review40-49.part1 .codex/review40-49.part2 .codex/review40-49.part3 .codex/review40-49.part4 .codex/review40-49.part5 | base64 -d | gzip -d > scripts/apply-review40-49.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/apply-review40-49.py')
          s=p.read_text(encoding='utf-8')
          old='for n in ["SMAI_VERSION\', \'1.0.0-rc.7\'"'
          new='for n in ["SMAI_VERSION\', \'1.0.0-rc.8\'"'
          if old not in s:
              raise SystemExit('SR-48 invariant release anchor not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
          python3 -m py_compile scripts/apply-review40-49.py
      - name: Remove one-shot trigger, workflow and staged payloads from QA surface
        run: |
          rm -f .codex/review40-49.ready
          rm -f .codex/review40-49.part1 .codex/review40-49.part2 .codex/review40-49.part3 .codex/review40-49.part4 .codex/review40-49.part5
          rm -f .codex/apply-review40-49.py.gz.b64
          rm -f .github/workflows/apply-review40-49.yml
          rmdir .codex 2>/dev/null || true
      - name: Run ten sequential review rounds
        run: python3 scripts/apply-review40-49.py
      - name: Remove one-shot review runner
        run: rm -f scripts/apply-review40-49.py
      - name: Final source QA after one-shot cleanup
        run: bash scripts/qa.sh
      - name: Verify deterministic release build
        run: bash scripts/verify-deterministic-build.sh
      - name: Commit corrections and review evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
          else
            git commit -m 'review 40-49: close sequential ten-round defects'
            git push
          fi
