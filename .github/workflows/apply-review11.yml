name: Apply CF-05 Review 11
on:
  push:
    branches: [codex/cf-05-foundation-0.1.0]
    paths: ['.codex/review11.ready']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Apply review 11 fixes
        run: python3 scripts/apply-review11.py
      - name: Remove one-shot files
        run: rm -f .codex/review11.ready scripts/apply-review11.py .github/workflows/apply-review11.yml && rmdir .codex 2>/dev/null || true
      - name: Full governed QA
        run: bash scripts/qa.sh
      - name: Deterministic package verification
        run: bash scripts/verify-deterministic-build.sh
      - name: Commit review 11 fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'review 11: close activation and authorization defects'
          git push origin HEAD:codex/cf-05-foundation-0.1.0
