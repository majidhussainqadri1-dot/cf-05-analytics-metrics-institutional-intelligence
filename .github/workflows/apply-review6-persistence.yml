name: Apply CF-05 Review 6 Persistence
on:
  push:
    branches: [codex/cf-05-foundation-0.1.0]
    paths: ['.codex/review6-persistence.ready']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Apply review 6 persistence fixes
        run: python3 scripts/apply-review6-persistence.py
      - name: Remove one-shot files
        run: rm -f .codex/review6-persistence.ready scripts/apply-review6-persistence.py .github/workflows/apply-review6-persistence.yml
      - name: Full governed QA
        run: bash scripts/qa.sh
      - name: Deterministic package verification
        run: bash scripts/verify-deterministic-build.sh
      - name: Commit review 6 fixes
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "review 6: bind Future runs to governed persistent artifacts"
          git push origin HEAD:codex/cf-05-foundation-0.1.0
