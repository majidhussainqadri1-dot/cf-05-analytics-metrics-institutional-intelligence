name: Finalize CF-05 Coding

on:
  push:
    branches:
      - codex/cf-05-foundation-0.1.0
    paths:
      - .codex/finalize-coding.ready

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Apply final source corrections
        run: python3 scripts/finalize-coding.py
      - name: Remove one-shot marker
        run: rm -rf .codex
      - name: Full governed QA
        run: bash scripts/qa.sh
      - name: Deterministic package verification
        run: bash scripts/verify-deterministic-build.sh
      - name: Commit final source closure
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: close remaining CF-05 coding defects"
          git push origin HEAD:${GITHUB_REF_NAME}
