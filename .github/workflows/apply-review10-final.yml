name: Apply CF-05 Review 10 Final
on:
  push:
    branches: [codex/cf-05-foundation-0.1.0]
    paths: ['.codex/review10-final.ready']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Apply review 10 final fixes
        run: python3 scripts/apply-review10-final.py
      - name: Remove one-shot review 10 files
        run: rm -f .codex/review10-final.ready scripts/apply-review10-final.py .github/workflows/apply-review10-final.yml && rmdir .codex 2>/dev/null || true
      - name: Full governed QA
        run: bash scripts/qa.sh
      - name: Deterministic package verification
        run: bash scripts/verify-deterministic-build.sh
      - name: Commit review 10 fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'review 10: close final release-governance defects'
          git push origin HEAD:codex/cf-05-foundation-0.1.0
